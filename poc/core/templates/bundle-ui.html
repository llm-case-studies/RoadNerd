{% extends 'base.html' %}
{% block head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bundle-ui.css', v=asset_ver) }}" />
{% endblock %}
{% block content %}
  <h1>📦 Bundle Management</h1>
  <p>This is a scaffold for the dedicated Bundle UI. Functionality mirrors the inline UI under /api-docs.</p>
  <div>
    <button id="scanBtn">📱 Scan Storage Devices</button>
  </div>
  <div id="storageList" class="status" style="margin-top: 10px;"></div>
  <div style="margin: 15px 0;">
    <h4>Bundle Options:</h4>
    <label style="display: block; margin: 5px 0;">
      <input type="checkbox" id="includeDeps" checked> 📦 Include Dependencies (Offline Mode) - 62MB
    </label>
    <label style="display: block; margin: 5px 0;">
      <input type="checkbox" id="includeModels" onchange="toggleModelSelection()"> 🧠 Include LLM Models
    </label>
    <div id="modelSelection" style="display: none; margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
      <h5>Select Models to Include:</h5>
      <button onclick="loadAvailableModels()" style="background: #17a2b8; color: white; padding: 6px 12px; margin: 5px 0;">🔄 Load Available Models</button>
      <div id="modelList" style="margin: 10px 0;"></div>
      <div style="margin: 5px 0;">
        <button onclick="selectAllModels()" style="background: #6c757d; color: white; padding: 4px 8px; margin: 2px;">All</button>
        <button onclick="selectCachedModels()" style="background: #6c757d; color: white; padding: 4px 8px; margin: 2px;">Cached Only</button>
        <button onclick="clearModelSelection()" style="background: #6c757d; color: white; padding: 4px 8px; margin: 2px;">None</button>
      </div>
    </div>
  </div>
  
  <div style="margin: 15px 0;">
    <label>Target Path:</label><br>
    <input id="targetPath" placeholder="e.g., /media/usb/roadnerd-bundle" style="width: 400px; margin: 5px 0;"/>
    <button id="createBtn" style="background: #ff6b35; color: white; padding: 8px 16px;">🚀 Create Bundle</button>
  </div>
  <div id="bundleProgress" style="display:none;">
    <h3>Progress</h3>
    <div class="progress">
      <div id="progressBar" class="bar" style="width: 0%;"></div>
    </div>
    <p id="progressText">Starting...</p>
  </div>
  <pre id="bundleOut">(waiting)</pre>
  <script src="{{ url_for('static', filename='js/bundle-ui.js', v=asset_ver) }}" defer></script>
{% endblock %}
